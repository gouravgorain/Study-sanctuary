<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Sanctuary | Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .glass { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); }
        body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: white; min-height: 100vh; font-family: 'Inter', sans-serif; }
        .hidden { display: none; }
    </style>
</head>
<body class="p-4 md:p-8">

    <nav class="max-w-4xl mx-auto flex justify-around mb-10 glass p-4 rounded-2xl">
        <button onclick="showPage('study')" class="hover:text-blue-400 flex flex-col items-center"><i data-lucide="book-open"></i><span class="text-xs mt-1">Study</span></button>
        <button onclick="showPage('motivation')" class="hover:text-yellow-400 flex flex-col items-center"><i data-lucide="zap"></i><span class="text-xs mt-1">Motivate</span></button>
        <button onclick="showPage('relief')" class="hover:text-green-400 flex flex-col items-center"><i data-lucide="wind"></i><span class="text-xs mt-1">Relief</span></button>
    </nav>

    <main class="max-w-4xl mx-auto">
        <section id="study-page" class="page-content text-center">
            <div class="glass p-10 rounded-3xl mb-6">
                <div class="mb-6 flex justify-center gap-2">
                    <input type="number" id="custom-min" placeholder="Mins" class="w-20 p-2 rounded bg-white/10 border border-white/20 text-center text-white">
                    <button onclick="setCustomTime()" class="bg-purple-600 hover:bg-purple-500 px-4 py-2 rounded-lg text-xs font-bold">SET TIMER</button>
                </div>

                <h2 class="text-6xl font-bold mb-6" id="timer-display">25:00</h2>
                
                <div class="flex justify-center gap-4">
                    <button onclick="toggleTimer()" id="timer-btn" class="bg-blue-600 hover:bg-blue-500 px-8 py-3 rounded-full font-bold">START FOCUS</button>
                    <button onclick="resetTimer()" class="bg-gray-700 px-8 py-3 rounded-full">RESET</button>
                </div>

                <div class="mt-8 pt-6 border-t border-white/10">
                    <p class="text-xs mb-3 text-gray-400 tracking-widest">FOCUS MUSIC (LO-FI)</p>
                    <audio id="lofi-player" loop src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>
                    <div class="flex justify-center gap-4">
                        <button onclick="playMusic()" id="music-btn" class="glass p-3 rounded-full hover:bg-white/20"><i data-lucide="play"></i></button>
                        <button onclick="pauseMusic()" class="glass p-3 rounded-full hover:bg-white/20"><i data-lucide="pause"></i></button>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="glass p-6 rounded-2xl">
                    <h3 class="text-xl mb-2">Study Points</h3>
                    <p class="text-4xl font-bold text-yellow-400" id="points">0 pts</p>
                </div>
                <div class="glass p-6 rounded-2xl">
                    <h3 class="text-xl mb-2 italic text-gray-300">"Stop wishing, start doing."</h3>
                </div>
            </div>
        </section>

        <section id="motivation-page" class="page-content hidden text-center">
            <h2 class="text-3xl font-bold mb-8">Daily Discipline</h2>
            <div class="glass p-8 rounded-3xl border-l-4 border-yellow-500 mb-4">
                <p class="text-2xl">"The pain of discipline is far less than the pain of regret."</p>
            </div>
        </section>

        <section id="relief-page" class="page-content hidden text-center">
            <h2 class="text-2xl font-bold mb-6">Breathe</h2>
            <div class="glass p-10 rounded-full w-48 h-48 mx-auto flex items-center justify-center animate-pulse border-4 border-green-500/30">
                <p>Focus...</p>
            </div>
        </section>
    </main>

    <script>
        let timeLeft = 25 * 60;
        let timerId = null;
        let points = localStorage.getItem('studyPoints') || 0;
        document.getElementById('points').innerText = points + " pts";

        const player = document.getElementById('lofi-player');

        function showPage(pageId) {
            document.querySelectorAll('.page-content').forEach(p => p.classList.add('hidden'));
            document.getElementById(pageId + '-page').classList.remove('hidden');
        }

        function setCustomTime() {
            const mins = document.getElementById('custom-min').value;
            if (mins > 0) {
                timeLeft = mins * 60;
                updateDisplay();
            }
        }

        function updateDisplay() {
            const mins = Math.floor(timeLeft / 60);
            const secs = timeLeft % 60;
            document.getElementById('timer-display').innerText = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function toggleTimer() {
            if (timerId) {
                clearInterval(timerId);
                timerId = null;
                document.getElementById('timer-btn').innerText = "RESUME";
            } else {
                document.getElementById('timer-btn').innerText = "PAUSE";
                timerId = setInterval(() => {
                    timeLeft--;
                    updateDisplay();
                    if (timeLeft <= 0) {
                        clearInterval(timerId);
                        points = parseInt(points) + 10;
                        localStorage.setItem('studyPoints', points);
                        document.getElementById('points').innerText = points + " pts";
                        alert("Session Done! +10 Points");
                        resetTimer();
                    }
                }, 1000);
            }
        }

        function resetTimer() {
            clearInterval(timerId);
            timerId = null;
            timeLeft = 25 * 60;
            updateDisplay();
            document.getElementById('timer-btn').innerText = "START FOCUS";
        }

        function playMusic() { player.play(); }
        function pauseMusic() { player.pause(); }

        lucide.createIcons();
    </script>
</body>
</html>
